<header>
  <nav aria-label="Main navigation">
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      >Home</a
    >
    <a routerLink="/report" routerLinkActive="active" ariaCurrentWhenActive="page">Report</a>
  </nav>
  <details #profile class="profile">
    <summary aria-label="Profile" title="Profile">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21v-2a8 8 0 0 1 16 0v2z" />
      </svg>
    </summary>
    <section class="profile-panel" aria-label="Profile details">
      @if (login.session(); as user) {
        <p class="profile-name">{{ user.name }}</p>
        <p class="login-label">Logged in</p>
        <time [attr.datetime]="user.loginTime">{{ user.loginTime | date: 'medium' }}</time>
        <button type="button" class="logout" (click)="login.logout()">Logout</button>
      }
    </section>
  </details>
  @if (header.notification(); as message) {
    <aside class="notification" role="status" aria-live="polite">
      <span>{{ message }}</span>
      <button
        type="button"
        class="notification-close"
        aria-label="Dismiss notification"
        title="Close"
        (click)="header.dismissNotification()"
      >
        <svg
          aria-hidden="true"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
    </aside>
  }
</header>
