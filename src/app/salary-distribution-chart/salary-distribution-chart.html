<div class="chart-scroll">
  <div class="chart-container" [style.height.px]="groups().length * 52 + 80">
    <canvas
      #canvas
      role="img"
      [attr.aria-label]="
        'Average salary by ' + grouping() + '. Exact values follow in the accessible table.'
      "
    ></canvas>
  </div>
</div>
<table class="visually-hidden">
  <caption>
    Average salary by
    {{
      grouping()
    }}
  </caption>
  <thead>
    <tr>
      <th scope="col">Group</th>
      <th scope="col">Average salary</th>
      <th scope="col">Employees</th>
      <th scope="col">Missing salaries</th>
    </tr>
  </thead>
  <tbody>
    @for (group of groups(); track group.key) {
      <tr>
        <th scope="row">{{ group.label }}</th>
        <td>
          {{
            group.averageSalary === null ? 'Not available' : (group.averageSalary | number: '1.2-2')
          }}
        </td>
        <td>{{ group.employeeCount }}</td>
        <td>{{ group.missingSalaryCount }}</td>
      </tr>
    }
  </tbody>
</table>
